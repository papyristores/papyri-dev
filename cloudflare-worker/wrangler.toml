name = "papyri-stats-proxy"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
GITHUB_OWNER = "papyristores"
GITHUB_REPO = "papyri-dev"
GITHUB_BRANCH = "main"
ALLOWED_ORIGIN = "https://papyristores.github.io,http://localhost:5173"

# Secrets (set via `wrangler secret put NAME`, never stored in this file):
#   GITHUB_TOKEN     - fine-grained PAT, write access to Contents on this repo only
#   DASHBOARD_TOKEN  - shared secret the frontend sends in X-Dashboard-Token
